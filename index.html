<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OVEJA CLOUD LIVE • Evento en Vivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER */
        .header {
            background: #111;
            padding: 20px 16px 12px;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(17, 17, 17, 0.95);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .live-badge {
            display: inline-block;
            background: #dc2626;
            color: white;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulse-live 1.5s ease-in-out infinite;
            margin-top: 6px;
        }

        @keyframes pulse-live {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        .header p {
            color: #888;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 400;
        }

        .header .update-info {
            color: #555;
            font-size: 11px;
            margin-top: 4px;
        }

        /* GALERÍA */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 4px;
            padding: 4px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: #161616;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .photo-card:active {
            transform: scale(0.97);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* WATERMARK EN LA IMAGEN (por si no quieres procesarlas) */
        .photo-card .watermark {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.4);
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 500;
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }

        .photo-card .photo-name {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 3px;
            backdrop-filter: blur(2px);
            font-weight: 500;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .photo-card .whatsapp-hint {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #25D366;
            color: white;
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .photo-card:active .whatsapp-hint {
            opacity: 1;
        }

        /* Solo en desktop mostramos el hover */
        @media (hover: hover) {
            .photo-card:hover .whatsapp-hint {
                opacity: 1;
            }
            .photo-card:hover {
                transform: scale(1.03);
                z-index: 2;
            }
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            color: #444;
            font-size: 14px;
            flex-direction: column;
            gap: 12px;
        }

        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a1a1a;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            color: #555;
            font-size: 15px;
            text-align: center;
            padding: 20px;
            flex-direction: column;
            gap: 8px;
        }

        .empty .icon {
            font-size: 48px;
            opacity: 0.3;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 95%;
            max-height: 85vh;
            position: relative;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            display: block;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .modal-footer {
            padding: 16px 20px;
            background: #111;
            border-top: 1px solid #1a1a1a;
        }

        .modal-footer .photo-info {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-footer .photo-info .name {
            color: #fff;
            font-weight: 600;
        }

        .modal-footer .photo-info .watermark-text {
            color: #666;
            font-size: 11px;
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 50px;
        }

        .btn-whatsapp {
            display: block;
            width: 100%;
            background: #25D366;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
            background: #1da851;
        }

        .btn-whatsapp .icon {
            font-size: 22px;
        }

        .btn-whatsapp .sub {
            font-weight: 400;
            font-size: 13px;
            opacity: 0.8;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 16px;
            color: #333;
            font-size: 11px;
            border-top: 1px solid #111;
            margin-top: 4px;
        }

        .footer a {
            color: #555;
            text-decoration: none;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 3px;
                padding: 3px;
            }
            .header h1 {
                font-size: 22px;
            }
            .modal-content {
                max-width: 98%;
            }
            .modal-footer .photo-info {
                font-size: 12px;
            }
        }

        /* CONTADOR DE FOTOS */
        .photo-counter {
            color: #444;
            font-size: 11px;
            margin-top: 4px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <h1>🐑 OVEJA CLOUD</h1>
        <div>
            <span class="live-badge">🔴 EN VIVO</span>
        </div>
        <p>📸 Subiendo fotos del evento <strong>cada hora</strong></p>
        <div class="update-info">
            <span id="fotoCounter">Cargando...</span>
            <span>•</span>
            <span id="lastUpdate">Actualizando...</span>
        </div>
    </header>

    <!-- GALERÍA -->
    <div id="gallery" class="gallery">
        <div class="loader">
            <div class="spinner"></div>
            <span>Cargando galería...</span>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarModal()">✕</button>
            <img id="modalImg" src="" alt="Foto">
            <div class="modal-footer">
                <div class="photo-info">
                    <span class="name" id="modalName">Nombre</span>
                    <span class="watermark-text">🔒 Con marca de agua</span>
                </div>
                <button class="btn-whatsapp" onclick="abrirWhatsApp()">
                    <span class="icon">💬</span>
                    Pedir esta foto por WhatsApp
                    <span class="sub">(solo una por persona)</span>
                </button>
                <p style="color:#444;font-size:11px;margin-top:8px;text-align:center;">
                    Al hacer clic aceptas recibir la foto original por WhatsApp
                </p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <span>📷 Todas las fotos tienen marca de agua</span>
        <span>•</span>
        <span>⏱ Actualización cada 10s</span>
        <br>
        <span style="color:#222;">© Oveja Cloud Live</span>
    </footer>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const SUPABASE_URL = "https://ndmduyqfxlqiirekmnga.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kbWR1eXFmeGxxaWlyZWttbmdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MjQzNDAsImV4cCI6MjA4ODEwMDM0MH0.1k29DJKccBgkwJinvAZOBlchSEMQUjU0C7uY8CKsbPw"; // ← REEMPLAZA ESTO
        const WHATSAPP_NUMBER = "59160004962"; // ← REEMPLAZA CON TU NÚMERO
        const BUCKET_NAME = "revelado-live";
        
        // Mensaje personalizado para WhatsApp
        const MENSAJE_BASE = "Hola, quiero la foto:";

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let fotos = [];
        let fotoSeleccionada = null;
        let timeoutActualizacion = null;

        // ============================================================
        // CARGAR FOTOS (OPTIMIZADO)
        // ============================================================
        async function cargarFotos(mostrarLoader = false) {
            try {
                if (mostrarLoader) {
                    document.getElementById('gallery').innerHTML = `
                        <div class="loader">
                            <div class="spinner"></div>
                            <span>Actualizando...</span>
                        </div>
                    `;
                }

                // Solo pedimos los nombres, NO los metadatos para ahorrar tráfico
                const { data, error } = await supabase.storage
                    .from(BUCKET_NAME)
                    .list('', {
                        limit: 100,
                        sortBy: { column: 'created_at', order: 'desc' }
                    });

                if (error) throw error;

                if (data && data.length > 0) {
                    fotos = data;
                    renderGaleria();
                    actualizarContador();
                    actualizarHoraActualizacion();
                } else {
                    document.getElementById('gallery').innerHTML = `
                        <div class="empty">
                            <div class="icon">📸</div>
                            <span>Aún no hay fotos</span>
                            <span style="font-size:12px;color:#333;">Pronto empezará el evento</span>
                        </div>
                    `;
                    actualizarContador(0);
                }

            } catch (error) {
                console.error('Error:', error);
                // Si hay error, mantenemos lo que ya teníamos
                if (!fotos.length) {
                    document.getElementById('gallery').innerHTML = `
                        <div class="empty">
                            <div class="icon">⚠️</div>
                            <span>Error al conectar</span>
                            <span style="font-size:12px;color:#333;">Reintentando en 30s...</span>
                        </div>
                    `;
                }
            }
        }

        // ============================================================
        // RENDERIZAR GALERÍA (OPTIMIZADO)
        // ============================================================
        function renderGaleria() {
            const gallery = document.getElementById('gallery');
            
            if (!fotos.length) {
                gallery.innerHTML = `
                    <div class="empty">
                        <div class="icon">📸</div>
                        <span>No hay fotos disponibles</span>
                    </div>
                `;
                return;
            }

            gallery.innerHTML = fotos.map((f, index) => {
                const nombre = f.name.replace(/\.[^/.]+$/, "");
                const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${f.name}`;
                // Usamos lazy loading nativo para ahorrar ancho de banda
                return `
                    <div class="photo-card" onclick="abrirModal(${index})" loading="lazy">
                        <img src="${url}" 
                             alt="${nombre}" 
                             loading="lazy"
                             decoding="async">
                        <span class="photo-name">${nombre}</span>
                        <span class="watermark">© OVEJA</span>
                        <div class="whatsapp-hint">💬</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // CONTADOR Y HORA
        // ============================================================
        function actualizarContador(total = null) {
            const el = document.getElementById('fotoCounter');
            const count = total !== null ? total : fotos.length;
            el.textContent = count === 1 ? '1 foto' : `${count} fotos`;
        }

        function actualizarHoraActualizacion() {
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdate').textContent = `Última: ${hora}`;
        }

        // ============================================================
        // MODAL
        // ============================================================
        function abrirModal(index) {
            if (index < 0 || index >= fotos.length) return;
            
            const foto = fotos[index];
            const nombre = foto.name.replace(/\.[^/.]+$/, "");
            const url = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${foto.name}`;
            
            fotoSeleccionada = {
                nombre: nombre,
                url: url
            };
            
            document.getElementById('modalImg').src = url;
            document.getElementById('modalName').textContent = `📷 ${nombre}`;
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
            fotoSeleccionada = null;
        }

        // ============================================================
        // WHATSAPP (SOLO UNA FOTO)
        // ============================================================
        function abrirWhatsApp() {
            if (!fotoSeleccionada) return;
            
            const mensaje = `${MENSAJE_BASE} "${fotoSeleccionada.nombre}"`;
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            
            // Abrimos WhatsApp
            window.open(url, '_blank');
            
            // Cerrar modal después de un momento
            setTimeout(() => {
                cerrarModal();
            }, 500);
        }

        // ============================================================
        // CIERRE DE MODAL CON ESC Y CLICK FUERA
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) cerrarModal();
        });

        // ============================================================
        // INICIO Y ACTUALIZACIÓN AUTOMÁTICA (CADA 10 SEGUNDOS)
        // ============================================================
        // Cargar inicial
        cargarFotos(true);

        // Actualizar cada 10 segundos (más que suficiente)
        setInterval(() => {
            cargarFotos(false);
        }, 10000);

        // Actualizar la hora cada minuto
        setInterval(() => {
            actualizarHoraActualizacion();
        }, 60000);

        // ============================================================
        // SERVICE WORKER PARA CACHÉ (OPCIONAL - PARA OPTIMIZAR AÚN MÁS)
        // ============================================================
        // Si quieres implementar caché de imágenes, puedes agregar:
        // - PWA manifest
        // - Service worker para cachear imágenes ya vistas
        // Esto reduciría aún más el consumo de Supabase

        console.log('🐑 Oveja Cloud Live iniciado');
        console.log(`📸 ${fotos.length} fotos cargadas`);
        console.log('⏱ Actualizando cada 10 segundos');
        console.log('💬 WhatsApp: solo una foto por persona');
        console.log('🔒 Todas las fotos tienen marca de agua');
    </script>

</body>
</html>
